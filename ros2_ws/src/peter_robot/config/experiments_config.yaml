# experiments_config.yaml
# Configuración oficial de experimentos para el Test Manager de PETER.
# Fuente de verdad para todos los parámetros de orquestación.
# Generado conforme a la especificación de las Fases 2–5 del proyecto.

global_settings:
  workspace_path: "/ros2_ws"                                 # <--- CORREGIDO (Ruta nativa en el contenedor)
  output_base_dir: "/ros2_ws/src/peter_robot/docs/resultados" # <--- RECOMENDADO (Para que caiga directo en tu carpeta montada)
  grace_period_teardown_s: 5.0

experiment_suites:

  # ──────────────────────────────────────────────────────────────────────────
  # FAMILIA A1 — Estímulo Apetitivo (Target Azul)
  # Éxito: X17 > 0.8 + Tresponse > 0 mantenidos 2 s continuos.
  # ──────────────────────────────────────────────────────────────────────────
  - suite_name: "familia_a_apetitivo"
    launch_file: "single_stimulus.launch.py"
    repetitions: 15
    dynamic_parameters:
      world_name: "single_stimulus"
      stimulus_type: "blue"
      stimulus_x: 4.0
      stimulus_y: -2.0
      timeout_s: 45.0
      random_perturbation: true
      variance_sigma: 0.15

  # ──────────────────────────────────────────────────────────────────────────
  # FAMILIA A2 — Estímulo Obstáculo (Target Verde)
  # Éxito: transición a X14 + estímulo fuera de vista + TR < 1.0.
  # ──────────────────────────────────────────────────────────────────────────
  - suite_name: "familia_a_obstaculo"
    launch_file: "single_stimulus.launch.py"
    repetitions: 15
    dynamic_parameters:
      world_name: "single_stimulus"
      stimulus_type: "green"
      stimulus_x: 0.5
      stimulus_y: -0.75
      timeout_s: 60.0
      random_perturbation: true
      variance_sigma: 0.05

  # ──────────────────────────────────────────────────────────────────────────
  # FAMILIA A3 — Estímulo Aversivo (Target Rojo)
  # Éxito: modo huida (H) + estímulo fuera de vista + TR < 1.0.
  # ──────────────────────────────────────────────────────────────────────────
  - suite_name: "familia_a_aversivo"
    launch_file: "single_stimulus.launch.py"
    repetitions: 15
    dynamic_parameters:
      world_name: "single_stimulus"
      stimulus_type: "red"
      stimulus_x: 2.0
      stimulus_y: -0.5
      timeout_s: 40.0
      random_perturbation: true
      variance_sigma: 0.15

  # ──────────────────────────────────────────────────────────────────────────
  # FAMILIA B — Navegación Compleja (Estímulos Múltiples)
  # Éxito: secuencia X16→X14→X15→X17 completada + Tresponse > 0.
  # timeout obligatoriamente > 120 s según especificación.
  # ──────────────────────────────────────────────────────────────────────────
  - suite_name: "familia_b_compleja"
    launch_file: "multiple_stimuli.launch.py"
    repetitions: 15
    dynamic_parameters:
      world_name: "multiple_stimuli"
      spawn_green: true
      green_x: 0.0
      green_y: -0.8
      spawn_red: true
      red_x: 2.5
      red_y: 1.625
      spawn_blue: true
      blue_x: 3.0
      blue_y: -1.5
      timeout_s: 150.0
      random_perturbation: false

  # ──────────────────────────────────────────────────────────────────────────
  # FAMILIA C1 — Transición a Terreno Irregular
  # ──────────────────────────────────────────────────────────────────────────
  - suite_name: "familia_c1_terreno_rugoso"
    launch_file: "terrain_navigation.launch.py"    # <--- AQUÍ ESTÁ EL CAMBIO CRÍTICO
    repetitions: 15
    dynamic_parameters:
      world_name: "terrain"
      timeout_s: 120.0
      random_perturbation: false

  # ──────────────────────────────────────────────────────────────────────────
  # FAMILIA C2 — Prueba de Pendiente Inclinada
  # Éxito: pitch > 5° → X1 activo → modo móvil H + Tswitch + 12 s estables.
  # ──────────────────────────────────────────────────────────────────────────
  - suite_name: "familia_c2_pendiente"
    launch_file: "gazebo.launch.py"
    repetitions: 15
    dynamic_parameters:
      world_name: "terrain"
      timeout_s: 120.0
      random_perturbation: false

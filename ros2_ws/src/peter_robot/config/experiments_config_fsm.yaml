  # ──────────────────────────────────────────────────────────────────────────
  # FAMILIA C1 FSM — Transición a Terreno Irregular
  # IGNORE_IMU_TERRAIN=false y Usigma_az=3.3 se pasan desde terrain_navigation.launch.py

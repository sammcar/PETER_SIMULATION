# experiments_config_fsm.yaml
# Configuración de experimentos FSM para comparación con lógica neuronal.
# Usar con: peter-run-fsm  (o ros2 run peter_robot test_manager <esta-ruta>)
# Activar/desactivar suites comentando/descomentando los bloques.

global_settings:
  workspace_path: "/home/ros/docker_simulation_ws/PETER_SIMULATION/ros2_ws"
  output_base_dir: "/home/ros/docker_simulation_ws/PETER_SIMULATION/ros2_ws/src/peter_robot/docs/resultados/simulation"
  grace_period_teardown_s: 5.0

experiment_suites:

  # ──────────────────────────────────────────────────────────────────────────
  # FAMILIA A1 FSM — Estímulo Apetitivo (Target Azul)  [COMPLETADA: 15/15 ✓]
  # ──────────────────────────────────────────────────────────────────────────
  # - suite_name: "familia_a_apetitivo_fsm"
  #   launch_file: "single_stimulus.launch.py"
  #   repetitions: 15
  #   dynamic_parameters:
  #     controller: "fsm"
  #     world_name: "single_stimulus"
  #     stimulus_type: "blue"
  #     stimulus_x: 4.0
  #     stimulus_y: -2.0
  #     timeout_s: 45.0
  #     random_perturbation: true
  #     variance_sigma: 0.15

  # ──────────────────────────────────────────────────────────────────────────
  # FAMILIA A2 FSM — Estímulo Obstáculo (Target Verde)
  # ──────────────────────────────────────────────────────────────────────────
  # - suite_name: "familia_a_obstaculo_fsm"
  #   launch_file: "single_stimulus.launch.py"
  #   repetitions: 15
  #   dynamic_parameters:
  #     controller: "fsm"
  #     world_name: "single_stimulus"
  #     stimulus_type: "green"
  #     stimulus_x: 0.5
  #     stimulus_y: -0.75
  #     timeout_s: 60.0
  #     random_perturbation: true
  #     variance_sigma: 0.05

  # ──────────────────────────────────────────────────────────────────────────
  # FAMILIA A3 FSM — Estímulo Aversivo (Target Rojo)
  # ──────────────────────────────────────────────────────────────────────────
  - suite_name: "familia_a_aversivo_fsm"
    launch_file: "single_stimulus.launch.py"
    repetitions: 15
    dynamic_parameters:
      controller: "fsm"
      world_name: "single_stimulus"
      stimulus_type: "red"
      stimulus_x: 2.0
      stimulus_y: -0.5
      timeout_s: 40.0
      random_perturbation: true
      variance_sigma: 0.15

  # ──────────────────────────────────────────────────────────────────────────
  # FAMILIA B FSM — Navegación Compleja (Estímulos Múltiples)
  # ──────────────────────────────────────────────────────────────────────────
  # - suite_name: "familia_b_compleja_fsm"
